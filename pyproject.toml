[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agrirobust"
version = "0.1.0"
description = "Robust On-Device Crop Disease Diagnosis - Efficient Computer Vision with Distillation, Calibration, and Abstention"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "AgriRobust Team" }
]
license = { text = "MIT" }
keywords = ["agriculture", "computer-vision", "knowledge-distillation", "robustness", "uncertainty"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0,<3.0.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.4.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
