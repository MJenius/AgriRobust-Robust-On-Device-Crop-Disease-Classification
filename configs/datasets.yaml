# ==============================================================================
# AgriRobust Dataset Specification and Source Registry
#
# Authoritative reference: PROJECT_SOT.md Section 7, 8, 13
# Current Phase: Phase 1 (Dataset Foundation - Frozen & Verified)
# ==============================================================================

version: "1.1.0"
registry_status: "PHASE_1_VERIFIED"

datasets:
  plantvillage:
    name: "PlantVillage"
    purpose: "Controlled-domain training / baseline dataset"
    sot_section: "7.1"
    role: "training_and_validation"
    allowed_for_training: true
    allowed_for_cross_domain_eval: false
    source_url: "https://github.com/spMohanty/PlantVillage-Dataset"
    expected_modality: "RGB image"
    task: "multi_class_plant_disease_classification"
    access_method: "Public git repository (crowdsourced benchmark)"
    license_notes: "Creative Commons Attribution-ShareAlike (CC BY-SA)"
    expected_local_dir: "data/raw/plantvillage_repo/raw/color"
    canonical_split_manifest: "data/manifests/plantvillage_manifest.json"
    status:
      source_info: "VERIFIED"
      exact_image_count: 54305
      exact_class_count: 38
      corrupted_files: 0
      exact_internal_duplicates: 21
      exact_directory_structure: "raw/color/<raw_class_name>/*.jpg"
      split_policy: "70% train (38,047), 15% val (8,129), 15% test (8,129) deterministically partitioned by seed 42"

  plantdoc:
    name: "PlantDoc"
    purpose: "In-the-wild cross-dataset evaluation (natural domain shift)"
    sot_section: "7.2"
    role: "cross_domain_evaluation"
    allowed_for_training: false
    allowed_for_cross_domain_eval: true
    source_url: "https://github.com/pratikkayal/PlantDoc-Dataset"
    detection_source_url: "https://github.com/pratikkayal/PlantDoc-Object-Detection-Dataset"
    expected_modality: "RGB image (detection annotations with 8,921 bounding boxes)"
    task: "cropped_plant_leaf_disease_classification"
    task_policy:
      decision: "classification_on_plant_leaf_crops"
      rationale: "PlantDoc in-the-wild multi-object detection imagery is processed into discrete leaf crops to evaluate the compact classifier under natural distribution shift without multi-object confounding."
    access_method: "Public git repositories"
    license_notes: "CC BY 4.0"
    expected_local_dir: "data/raw/plantdoc_od"
    canonical_split_manifest: "data/manifests/plantdoc_crops_manifest.json"
    status:
      source_info: "VERIFIED"
      exact_image_count: 2581
      exact_bounding_boxes: 8921
      exact_valid_leaf_crops: 8883
      exact_class_count: 29
      split_policy: "100% held-out test set for cross-domain evaluation (8,883 leaf crops across 29 canonical classes)"

  plantseg:
    name: "PlantSeg"
    purpose: "In-the-wild disease localization and robustness evaluation"
    sot_section: "7.3"
    role: "segmentation_and_robustness_evaluation"
    allowed_for_training: false
    allowed_for_cross_domain_eval: true
    source_url: "https://github.com/tqwei05/PlantSeg"
    zenodo_url: "https://zenodo.org/records/14935094"
    archive_file: "plantsegv3.zip"
    expected_modality: "RGB image + segmentation mask"
    task: "semantic_segmentation_or_auxiliary_localization"
    access_method: "Zenodo archive via GitHub project repository"
    license_notes: "CC BY 4.0"
    expected_local_dir: "data/raw/plantseg_zenodo"
    canonical_split_manifest: "data/manifests/plantseg_manifest.json"
    status:
      source_info: "VERIFIED"
      exact_image_count: 11458
      exact_class_count: 115
      split_policy: "Preserved official benchmark splits (train: 8,020, val: 1,146, test: 2,292)"

  agrobench:
    name: "AgroBench"
    purpose: "Broader external agricultural sanity check (optional VLM benchmark)"
    sot_section: "7.4"
    role: "optional_broader_evaluation"
    allowed_for_training: false
    allowed_for_cross_domain_eval: true
    source_url: "https://huggingface.co/datasets/Project-AgML/AgroBench"
    source_alternatives:
      - "https://huggingface.co/datasets/risashinoda/AgroBench"
    expected_modality: "RGB image / benchmark questions / tasks"
    task: "agricultural_vlm_benchmark_suite"
    access_method: "Hugging Face Datasets"
    license_notes: "CC BY-NC 4.0"
    expected_local_dir: "data/raw/agrobench"
    canonical_split_manifest: "data/manifests/agrobench_manifest.json"
    status:
      source_info: "VERIFIED"
      exact_image_count: 4342
      exact_class_count: "203 crop categories / 682 sub-classes"
      split_policy: "Optional external VLM verification"

  field_collected:
    name: "field-collected dataset"
    purpose: "Real-world smartphone evaluation under authentic field conditions"
    sot_section: "7.5"
    role: "field_evaluation_only"
    allowed_for_training: false
    allowed_for_cross_domain_eval: true
    source_url: "INTERNAL / PROJECT_GENERATED"
    expected_modality: "Smartphone camera RGB photos"
    task: "real_world_field_diagnosis_and_abstention"
    access_method: "Locally collected smartphone images"
    license_notes: "Internal project evaluation asset"
    expected_local_dir: "data/raw/field_collected"
    canonical_split_manifest: "data/manifests/field_collected_manifest.json"
    status:
      source_info: "VERIFIED"
      exact_image_count: "UNKNOWN — TO BE COLLECTED IN PHASE 9"
      exact_class_count: "TO_MATCH_CANONICAL_SUBSET_IN_PHASE_1"
      exact_directory_structure: "TO_BE_DEFINED_IN_PHASE_9"
      split_policy: "TEST_ONLY"

# Dataset class and label policy established in Phase 1
label_policy:
  canonical_representation: "<crop>___<condition_or_healthy>"
  total_canonical_classes: 38
  shared_cross_domain_classes: 29
  plantvillage_only_classes: 9
  plantdoc_only_classes: 0
  healthy_classes_count: 12
  disease_classes_count: 26
  train_evaluation_compatibility: "Cross-domain evaluation on PlantDoc will evaluate the 29 shared classes; 9 PlantVillage-only classes will be evaluated clean-domain only."
