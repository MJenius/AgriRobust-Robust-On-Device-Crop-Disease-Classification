# ==============================================================================
# AgriRobust Master Project & Experiment Configuration Specification
#
# Authoritative reference: PROJECT_SOT.md Section 6, 9, 10, 11, 12, 15, 18
# Current Phase: Phase 0 (Project contract and environment)
#
# RULE: Do not choose arbitrary hyper-parameters or architecture decisions that belong
# to Phase 2+. Explicitly designate them with TO_BE_DEFINED_IN_PHASE_X placeholders.
# ==============================================================================

project:
  name: "AgriRobust"
  working_title: "Robust On-Device Crop Disease Diagnosis"
  phase: 0
  version: "0.1.0"
  description: "Compact agricultural CV model with distillation, calibration, and abstention"

# ------------------------------------------------------------------------------
# Reproducibility & Random Seed Policy
# ------------------------------------------------------------------------------
reproducibility:
  primary_seed: 42
  evaluation_seeds:
    - 42
    - 1337
    - 2026
  deterministic_torch: true
  deterministic_cudnn: true
  record_git_hash: true
  record_environment: true

# ------------------------------------------------------------------------------
# System & Path Conventions
# ------------------------------------------------------------------------------
paths:
  data_root: "data"
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  manifests_dir: "data/manifests"
  artifacts_root: "experiments"
  checkpoints_dir: "experiments/checkpoints"
  logs_dir: "experiments/logs"
  runs_dir: "experiments/runs"
  reports_dir: "reports"

# ------------------------------------------------------------------------------
# Experiment Naming Policy
# Format: P<phase>_<role>_<architecture>_<dataset>_<variant>_s<seed>
# ------------------------------------------------------------------------------
experiment_naming:
  pattern: "P{phase:02d}_{role}_{architecture}_{dataset}_{variant}_s{seed}"
  examples:
    teacher_baseline: "P02_teacher_timm_convnext_plantvillage_baseline_s42"
    student_scratch: "P03_student_mobilenetv3_small_plantvillage_scratch_s42"
    knowledge_distillation: "P04_student_mobilenetv3_small_plantvillage_kd_response_s42"
    quantization_int8: "P07_student_mobilenetv3_small_plantvillage_ptq_int8_s42"

# ------------------------------------------------------------------------------
# Experiment Run Metadata Schema
# Every experiment execution must record this full schema into run_metadata.json
# ------------------------------------------------------------------------------
metadata_schema:
  required_fields:
    - "experiment_id"
    - "git_commit"
    - "timestamp_utc"
    - "python_version"
    - "torch_version"
    - "device"
    - "random_seed"
    - "model_role"
    - "model_architecture"
    - "dataset_name"
    - "dataset_version"
    - "input_resolution"
    - "hyperparameters"
    - "checkpoint_path"
    - "metrics_summary"

# ------------------------------------------------------------------------------
# Model Architecture Placeholders (To be formalized in Phase 2 & 3)
# ------------------------------------------------------------------------------
models:
  teacher:
    role: "High-capacity reference model"
    sot_section: "6.1"
    architecture: "convnext_tiny"
    pretrained_weights: "ConvNeXt_Tiny_Weights.IMAGENET1K_V1"
    input_resolution: [3, 224, 224]
    total_parameters: 27849350
    checkpoint_file_size_mb: 106.306
    primary_checkpoint: "experiments/checkpoints/P02_teacher_convnext_tiny_plantvillage_s42.pt"
    primary_checkpoint_sha256: "7b80b48404531597f098571e56d53f03676305b57a7938ff27a4389e8fa1d1af"
    phone_deployment_required: false

  student:
    role: "Deployment-oriented compact vision model"
    sot_section: "6.2"
    preferred_family: "MobileNet-family"
    architecture: "mobilenet_v3_small"
    pretrained_weights: "MobileNet_V3_Small_Weights.IMAGENET1K_V1"
    input_resolution: [3, 224, 224]
    total_parameters: 1556806
    parameter_ratio_of_teacher: 0.0559
    checkpoint_file_size_mb: 6.076
    primary_checkpoint: "experiments/checkpoints/P03_student_mobilenetv3_small_plantvillage_s42.pt"
    primary_checkpoint_sha256: "6076d8a2b0f4d5d562b2ce380df91ceb2561b1105b13eeab08a60fe93cce2eee"
    phone_deployment_required: true

# ------------------------------------------------------------------------------
# Training Hyperparameters Frozen in Phase 2 & Phase 3
# ------------------------------------------------------------------------------
training:
  teacher:
    batch_size: 256
    optimizer: "AdamW"
    learning_rate: 0.001
    lr_scheduler: "CosineAnnealingLR (eta_min=1e-5)"
    num_epochs: 15
    weight_decay: 0.0001
    loss_function: "CrossEntropyLoss"
    random_seeds: [42, 1337, 2026]

  student_baseline:
    batch_size: 128
    optimizer: "AdamW"
    learning_rate: 0.001
    lr_scheduler: "CosineAnnealingLR (eta_min=1e-5)"
    num_epochs: 15
    weight_decay: 0.0001
    loss_function: "CrossEntropyLoss"
    distillation_applied: false
    compression_applied: false
    primary_seed: 42

# ------------------------------------------------------------------------------
# Distillation Configurations & Checkpoints Frozen in Phase 4
# ------------------------------------------------------------------------------
distillation:
  teacher_reference_checkpoint: "experiments/checkpoints/P02_teacher_convnext_tiny_plantvillage_s42.pt"
  student_baseline_checkpoint: "experiments/checkpoints/P03_student_mobilenetv3_small_plantvillage_s42.pt"
  teacher_cross_macro_f1: 0.2073
  student_baseline_cross_macro_f1: 0.1298
  cross_domain_gap_baseline: 0.0775

  ablations:
    response:
      mode: "response"
      temperature: 4.0
      alpha: 0.5
      epochs: 8
      checkpoint_path: "experiments/checkpoints/P04_student_kd_response_plantvillage_s42.pt"
      checkpoint_sha256: "2b935203522c1a58ce94963b251ae80b9a6669a2c1f1c74658a48e36195eb8c6"
      clean_macro_f1: 0.9884
      plantdoc_cross_macro_f1: 0.1791
      gap_recovered_pct: 63.61
      relative_gain_over_student_pct: 37.98

    feature:
      mode: "feature"
      beta: 0.5
      student_dim: 576
      teacher_dim: 768
      epochs: 8
      checkpoint_path: "experiments/checkpoints/P04_student_kd_feature_plantvillage_s42.pt"
      checkpoint_sha256: "f41bc3ecd9e36076f7ba100194156cb79e567f9b9fb3a9d7b39dcf20c497681f"
      clean_macro_f1: 0.9955
      plantdoc_cross_macro_f1: 0.1349
      gap_recovered_pct: 6.58
      relative_gain_over_student_pct: 3.93

    combined:
      mode: "combined"
      temperature: 4.0
      alpha: 0.5
      beta: 0.5
      epochs: 8
      checkpoint_path: "experiments/checkpoints/P04_student_kd_combined_plantvillage_s42.pt"
      checkpoint_sha256: "5bf8a40a6762f282e88d52d48944d24203f52eac36600d8d37fc97c7f276a4fa"
      clean_macro_f1: 0.9885
      plantdoc_cross_macro_f1: 0.1576
      gap_recovered_pct: 35.87
      relative_gain_over_student_pct: 21.42

  champion_distillation_model: "response"
  champion_checkpoint: "experiments/checkpoints/P04_student_kd_response_plantvillage_s42.pt"

# ------------------------------------------------------------------------------
# Phase 5 Robustness Evaluation Parameters and Champion Results
# ------------------------------------------------------------------------------
phase_05_robustness:
  status: "FROZEN"
  benchmark_dataset_size: 8129
  plantdoc_crop_dataset_size: 8883
  corruption_families:
    - "brightness"
    - "contrast"
    - "defocus_blur"
    - "gaussian_noise"
    - "jpeg_compression"
    - "resolution"
    - "occlusion"
  severities: [1, 2, 3, 4, 5]
  normalization_reference: "student_baseline"
  metrics_summary:
    teacher_mrce_pct: 95.81
    student_baseline_mrce_pct: 100.00
    response_kd_champion_mrce_pct: 79.87
    feature_kd_mrce_pct: 96.12
    combined_kd_mrce_pct: 81.75
  plantdoc_cross_domain_macro_f1:
    teacher: 0.2062
    student_baseline: 0.1298
    response_kd_champion: 0.1791
    feature_kd: 0.1349
    combined_kd: 0.1576

# ------------------------------------------------------------------------------
# Success Criteria Targets (SOT Section 18) - Targets, not guarantees
# ------------------------------------------------------------------------------
targets:
  parameter_ratio_target: "<= 0.10"       # <=10% of teacher parameters
  model_size_mb_target: "<= 15.0"         # <=15 MB file size
  retention_field_macro_f1: ">= 0.95"     # >=95% of teacher field-domain macro-F1
  offline_inference: true                 # Fully offline Android execution
  phone_latency_ms_target: "< 100.0"      # <100 ms end-to-end where hardware permits
  abstention_benefit: "measurably reduces high-confidence errors"
